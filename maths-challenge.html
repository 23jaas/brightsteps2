<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BrightSteps Maths Challenge</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(#eef7ff,#fff8ed);color:#20304a}.wrap{max-width:820px;margin:auto;padding:18px}.hero,.card{border-radius:24px;padding:22px;box-shadow:0 12px 32px #53647a22}.hero{background:linear-gradient(135deg,#2f80ed,#7c5cff);color:white}.card{background:white;margin-top:16px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}button,select{font:inherit;border:0;border-radius:14px;padding:12px 15px;font-weight:800}button{background:#2f80ed;color:white;cursor:pointer}select{background:#f1f4f9}.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ans{background:#fff;color:#20304a;border:2px solid #e4eaf2;text-align:left}.ok{background:#e8fff2!important;border-color:#42c788!important}.no{background:#fff0f2!important;border-color:#ff6675!important}.teacher{background:#fff8dc;border:2px solid #ffe19b;border-radius:20px;padding:16px;margin:16px 0;display:none}.teacher.show{display:block}.teacher .face{font-size:52px}.method{background:#f3efff;padding:12px;border-radius:12px}.stats{display:flex;gap:12px;margin-top:14px}.stat{background:#f6f8fb;padding:10px 14px;border-radius:12px;font-weight:800}@media(max-width:600px){.answers{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><h1>Maths Challenge 🔢</h1><p>Learn the method with Professor Bright, practise it, then recap what you learned.</p></section><section class="card"><div class="row"><select id="topic"><option value="add">Addition</option><option value="times">Multiplication</option><option value="frac">Fractions</option></select><button id="start">Start lesson</button></div><div id="teacher" class="teacher"><div class="face">👨‍🏫</div><h2 id="teachTitle">Professor Bright</h2><div id="teachText"></div><button id="closeTeach">Continue →</button></div><div id="lesson" style="display:none"><p id="count"></p><h2 id="q"></h2><div id="answers" class="answers"></div><p id="feedback"></p><button id="next" style="display:none">Next question →</button><div class="stats"><div class="stat">⭐ <span id="stars">0</span></div><div class="stat">Points: <span id="score">0</span></div></div></div><div id="end" style="display:none"><h2>Lesson complete 🎉</h2><p id="summary"></p><button id="again">Try another lesson</button></div></section></main><script>const G={add:{name:'Addition',def:'Addition combines two or more amounts to find a total.',method:'Line up the place values: ones under ones, tens under tens and hundreds under hundreds. Add from right to left. Regroup when a column totals 10 or more.',example:'347 + 286: 7 + 6 = 13, write 3 and carry 1. Then continue left.',eq:'347 + 286 = 633'},times:{name:'Multiplication',def:'Multiplication is a quick way of adding equal groups.',method:'Use times-table facts and split harder numbers into easier parts. For example, split 12 into 10 and 2.',example:'12 × 6 = (10 × 6) + (2 × 6) = 60 + 12.',eq:'12 × 6 = 72'},frac:{name:'Fractions',def:'A fraction represents equal parts of a whole. The top number is the numerator and the bottom number is the denominator.',method:'To find a fraction of an amount, divide by the denominator first, then multiply by the numerator.',example:'3/5 of 20: 20 ÷ 5 = 4, then 4 × 3 = 12.',eq:'3/5 of 20 = 12'}};const Q={add:[['What is 347 + 286?',['623','633','643','533'],1,'Work from right to left. 7 + 6 = 13, so regroup 1 ten.'],['What is 625 + 378?',['993','1003','1013','903'],1,'Line up hundreds, tens and ones, then regroup each column when needed.'],['What is 1,245 + 230?',['1,475','1,465','1,575','1,425'],0,'Keep each digit in the correct place-value column.']],times:[['What is 7 × 8?',['48','54','56','64'],2,'Think 5 × 8 = 40 and 2 × 8 = 16; 40 + 16 = 56.'],['What is 12 × 6?',['62','72','66','76'],1,'Split 12 into 10 + 2, multiply both by 6, then add.'],['What is 9 × 6?',['45','54','63','56'],1,'Use 10 × 6 = 60, then subtract one group of 6.']],frac:[['What is 1/4 of 20?',['4','5','6','8'],1,'Divide 20 by the denominator 4.'],['What is 3/5 of 20?',['8','10','12','15'],2,'20 ÷ 5 = 4, then multiply 4 by 3.'],['Which is equivalent to 1/2?',['2/3','3/6','4/10','5/12'],1,'Multiply the numerator and denominator by the same number.']]};let s={t:'add',i:0,score:0,stars:0,lock:false};const $=x=>document.getElementById(x);function teach(type,hint){let g=G[s.t];$('teacher').classList.add('show');if(type==='start'){$('teachTitle').textContent='Professor Bright: '+g.name;$('teachText').innerHTML='<p>'+g.def+'</p><div class="method"><b>Method:</b> '+g.method+'</div><p><b>Example:</b> '+g.example+'<br><b>'+g.eq+'</b></p>'}else if(type==='wrong'){$('teachTitle').textContent='Let’s work through that';$('teachText').innerHTML='<p>'+hint+'</p><div class="method"><b>Remember:</b> '+g.method+'</div>'}else{$('teachTitle').textContent='Lesson recap';$('teachText').innerHTML='<p>You practised <b>'+g.name+'</b>.</p><div class="method"><b>Key method:</b> '+g.method+'</div><p>Remember: <b>'+g.eq+'</b></p>'}}function render(){let q=Q[s.t][s.i];s.lock=false;$('count').textContent='Question '+(s.i+1)+' of '+Q[s.t].length;$('q').textContent=q[0];$('feedback').textContent='';$('next').style.display='none';$('answers').innerHTML='';q[1].forEach((a,i)=>{let b=document.createElement('button');b.className='ans';b.textContent=a;b.onclick=()=>answer(i,b);$('answers').appendChild(b)})}function answer(i,b){if(s.lock)return;s.lock=true;let q=Q[s.t][s.i],buttons=[...document.querySelectorAll('.ans')];buttons[q[2]].classList.add('ok');if(i===q[2]){s.score+=10;s.stars++;$('feedback').textContent='✅ Correct! Great work.'}else{b.classList.add('no');$('feedback').textContent='❌ Not quite. Professor Bright will show the method.';teach('wrong',q[3])}$('score').textContent=s.score;$('stars').textContent=s.stars;$('next').style.display='inline-block'}$('start').onclick=()=>{s={t:$('topic').value,i:0,score:0,stars:0,lock:false};$('lesson').style.display='block';$('end').style.display='none';$('score').textContent=0;$('stars').textContent=0;render();teach('start')};$('closeTeach').onclick=()=>{$('teacher').classList.remove('show')};$('next').onclick=()=>{s.i++;if(s.i>=Q[s.t].length){$('lesson').style.display='none';$('end').style.display='block';$('summary').textContent='You earned '+s.stars+' stars and '+s.score+' points.';teach('end')}else render()};$('again').onclick=()=>{$('end').style.display='none';$('lesson').style.display='none';window.scrollTo(0,0)};</script></body></html>
